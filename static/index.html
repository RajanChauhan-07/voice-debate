<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoiceDebate · 1v1 Competitive Real-Time Debates</title>
    <meta name="description" content="Minimalist 1v1 competitive voice-debating platform. Clean typography, real-time WebRTC audio, and rigorous AI adjudication.">
    
    <!-- Google Fonts: Inter with font-feature-settings for crisp Apple typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        apple: {
                            black: '#000000',
                            dark: '#0d0d0f',
                            card: '#161618',
                            border: 'rgba(255, 255, 255, 0.08)',
                            text: '#f5f5f7',
                            muted: '#86868b',
                            subtle: '#6e6e73'
                        }
                    },
                    fontFamily: {
                        sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Display"', '"SF Pro Text"', 'Inter', 'sans-serif'],
                        mono: ['"SF Mono"', 'SFMono-Regular', 'ui-monospace', 'Menlo', 'monospace']
                    }
                }
            }
        }
    </script>

    <!-- Custom Apple Minimalist CSS -->
    <link rel="stylesheet" href="/static/css/custom.css">

    <!-- React 18 & ReactDOM 18 CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <!-- Babel Standalone for JSX interpretation in browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-[#000000] text-[#f5f5f7] antialiased min-h-screen selection:bg-white selection:text-black">
    <!-- React Root Container -->
    <div id="root"></div>

    <!-- Hidden Remote Audio Sink for WebRTC -->
    <audio id="peer-remote-audio" autoplay></audio>

    <!-- App Scripts -->
    <script src="/static/js/audio_effects.js"></script>
    <script src="/static/js/webrtc.js"></script>
    <script src="/static/js/stt.js"></script>
    <script type="text/babel" src="/static/js/app.js"></script>
</body>
</html>
